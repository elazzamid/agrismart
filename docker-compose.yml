services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrismart}
      POSTGRES_USER: ${POSTGRES_USER:-agrismart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrismart_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrismart} -d ${POSTGRES_DB:-agrismart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
